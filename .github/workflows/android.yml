name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      run_lint:
        description: 'Executar Android Lint junto com o build'
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Android Lint
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_lint }}
        run: gradle :app:lintDebug --stacktrace

      - name: Prepare distributable APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$VERSION"
          APK_NAME="vw270-telemetry-${VERSION}-debug-r${GITHUB_RUN_NUMBER}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          (cd dist && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: vw270-telemetry-debug-${{ github.run_number }}
          path: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK in GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="debug-${VERSION}-r${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "dist/${APK_NAME}#Android APK" \
            "dist/${APK_NAME}.sha256#SHA-256" \
            --target "$GITHUB_SHA" \
            --title "VW270 Telemetry ${VERSION} · debug build #${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK produzido sob demanda pelo GitHub Actions. Build: ${GITHUB_RUN_NUMBER}. Commit: ${GITHUB_SHA}." \
            --prerelease
